[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sponsor-aware-job-agent"
version = "0.1.0"
description = "Sponsor-aware semi-automated job discovery and application tooling"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "PyYAML>=6,<7",
  "SQLAlchemy>=2.0,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<7",
  "respx>=0.21,<1",
  "ruff>=0.6,<1",
  "types-PyYAML>=6,<7",
]
resume = [
  "PyMuPDF>=1.24,<2",
  "python-docx>=1.1,<2",
]
web = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "lxml>=5,<6",
  "playwright>=1.47,<2",
  "rapidfuzz>=3.9,<4",
  "streamlit>=1.37,<2",
  "tenacity>=9,<10",
]
llm = ["openai>=1,<3"]
all = [
  "PyMuPDF>=1.24,<2",
  "python-docx>=1.1,<2",
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "lxml>=5,<6",
  "openai>=1,<3",
  "playwright>=1.47,<2",
  "rapidfuzz>=3.9,<4",
  "streamlit>=1.37,<2",
  "tenacity>=9,<10",
]

[project.scripts]
job-agent = "job_agent.cli:app"
job-agent-ui = "job_agent.ui.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["job_agent"]

[tool.coverage.run]
source = ["job_agent"]
branch = true
