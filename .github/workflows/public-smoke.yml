name: public-smoke

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Public smoke tests
        run: pytest tests/public -q
      - name: Compile source
        run: python -m compileall -q src
      - name: Synthetic golden evaluation
        run: job-agent evaluate-golden tests/golden/jobs/synthetic
